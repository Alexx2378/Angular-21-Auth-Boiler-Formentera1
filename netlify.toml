[build]
  command = "ng build --configuration production"
  publish = "dist/angular-15-example"

[build.environment]
  NODE_VERSION = "20.19.0"


# ── Proxy API calls to Render backend (bypasses CORS) ──────────────────────
[[redirects]]
  from = "/api/*"
  to = "https://auth-system-backend-j7xw.onrender.com/:splat"
  status = 200
  force = true

# ── SPA fallback (must be last) ────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
